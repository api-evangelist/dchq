name: DCHQ
description: DCHQ (Data Center HQ) was a cloud automation and Docker container management platform out
  of San Francisco, offering both a hosted PaaS (DCHQ.io) and self-hosted on-premise editions for modeling,
  deploying, and managing container-based applications across AWS, Azure, Google Cloud, Rackspace, and
  OpenStack. The platform covered application modeling (Docker Compose / JSON), infrastructure automation,
  multi-tenant governance and access controls, and lifecycle management including monitoring, backup, and
  auto-scaling, with integrations for Docker, GitHub, and Jenkins. The company is now defunct — its
  primary domain (dchq.co) no longer resolves and dchq.io serves a frozen 2020 marketing snapshot with no
  live developer portal, API reference, or machine-readable API surface. This profile is retained as a
  historical company record; no live API artifacts were available to enrich.
